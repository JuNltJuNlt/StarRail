<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>混沌回忆 · 星穹铁道</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #f5f6fa; display: flex; justify-content: center; padding: 20px; color: #333; }
        .canvas { position: relative; width: 1240px; background-color: #ffffff; box-shadow: 0 0 30px rgba(0, 0, 0, 0.1); padding: 30px 40px 10px; border-radius: 8px; overflow: hidden; }

        .download-btn {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.5);
            color: #7e22ce;
            padding: 8px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .download-btn:hover { background: rgba(168, 85, 247, 0.25); border-color: #a855f7; }
        .download-btn:active { transform: scale(0.97); }

        #btnBar {
            position: absolute;
            top: 30px;
            right: 40px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            z-index: 10;
        }
        #btnBar .btn-row { display: flex; gap: 10px; }
        #btnBar.hidden { display: none; }

        .header-section { display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 20px; }
        .header-section h1 { font-size: 28px; font-weight: 700; letter-spacing: 3px; color: #000; text-align: center; }

        .period-switcher { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 0 auto 20px; width: fit-content; background: #fff; border: 2px solid #000; border-radius: 30px; padding: 6px 22px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); }
        .period-switcher .arrow { font-size: 20px; font-weight: bold; cursor: pointer; user-select: none; color: #000; padding: 0 5px; }
        .period-switcher .date { font-size: 14px; font-weight: 600; color: #000; text-align: center; line-height: 1.3; min-width: 180px; }

        .period-trigger {
            cursor: pointer;
            user-select: none;
            padding: 4px 10px;
            border-radius: 12px;
            transition: background 0.15s;
        }
        .period-trigger:hover { background: rgba(168, 85, 247, 0.12); }

        .period-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        .period-overlay.show { display: flex; }

        .period-modal {
            background: #fff;
            border-radius: 16px;
            width: 860px;
            max-width: 92vw;
            max-height: 86vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
            animation: periodModalIn 0.18s ease-out;
        }
        @keyframes periodModalIn {
            from { transform: translateY(10px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .period-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px 24px 16px;
            border-bottom: 1px solid #eee;
        }
        .period-modal-title { font-size: 20px; font-weight: 800; color: #000; margin-bottom: 4px; }
        .period-modal-time  { font-size: 13px; color: #888; }
        .period-modal-close {
            background: none; border: none; font-size: 22px; cursor: pointer;
            color: #666; padding: 2px 8px; border-radius: 6px; transition: all 0.15s;
        }
        .period-modal-close:hover { background: #f0f0f0; color: #000; }

        .period-grid {
            padding: 20px 24px 24px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            overflow-y: auto;
        }

        .period-card {
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 16px 18px;
            cursor: pointer;
            transition: all 0.15s;
            background: #fff;
        }
        .period-card:hover {
            border-color: #a855f7;
            box-shadow: 0 4px 14px rgba(168, 85, 247, 0.18);
            transform: translateY(-1px);
        }
        .period-card.active {
            border-color: #a855f7;
            background: #faf5ff;
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.25);
        }
        .period-card .pc-name { font-size: 16px; font-weight: 800; color: #000; margin-bottom: 4px; }
        .period-card .pc-time { font-size: 13px; color: #888; }

        .floor-switcher { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 16px; }
        .floor-switcher .arrow { font-size: 20px; font-weight: bold; cursor: pointer; user-select: none; color: #000; padding: 0 5px; }
        .floor-switcher .floor-text { font-size: 18px; font-weight: 700; color: #000; min-width: 60px; text-align: center; }

        /* 记忆紊流框 */
        .buff-bar {
            background: #1e293b;
            color: #fff;
            border-radius: 4px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .buff-title { font-size: 16px; font-weight: 700; color: #fff; }
        .buff-desc { font-size: 13px; line-height: 1.7; color: #fff; }
        .buff-desc color { font-weight: bold; }

        /* 整体内容区，横排多个房间 */
        .content-area { display: flex; gap: 0; width: 100%; align-items: stretch; }
        
        /* 房间均分宽度并带分割线 */
        .side-section { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 0 10px; }
        .side-section:not(:last-child) { border-right: 1px dashed #ddd; }
        
        .side-title { font-size: 16px; font-weight: 700; color: #000; text-align: center; margin-bottom: 10px; }
        .side-title .level-text { font-size: 14px; font-weight: 400; color: #333; }
        
        .stage-block { display: flex; flex-direction: column; gap: 16px; }
        .wave-block { display: flex; flex-direction: column; align-items: center; }
        .wave-label { font-size: 14px; font-weight: 700; color: #000; margin: 10px 0; text-align: center; }

        /* 同一波的怪物横向紧凑居中 */
        .wave-monsters { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; align-items: flex-start; width: 100%; }

        /* 怪物卡片样式 */
        .monster-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90px; 
            text-align: center;
            margin-bottom: 10px;
        }
        
        .monster-icon { width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; margin-bottom: 2px; }
        .monster-icon img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15)); }
        .monster-icon .fallback { font-size: 32px; font-weight: 700; color: #a855f7; }
        
        /* 弱点元素行 */
        .monster-weakness { display: flex; justify-content: center; gap: 2px; margin-bottom: 6px; height: 16px; }
        .monster-weakness .elem-mini { width: 14px; height: 14px; border-radius: 50%; overflow: hidden; }
        .monster-weakness .elem-mini img { width: 100%; height: 100%; object-fit: cover; }

        /* 数值行，拉宽间距 */
        .monster-stats { display: flex; flex-direction: column; align-items: center; font-size: 13px; font-weight: bold; line-height: 1.8; }
        .monster-stats .stance { color: #6a1b9a; }
        .monster-stats .hp { color: #cc0000; }
        .monster-stats .speed { color: #2545ba; }

        .empty-hint { text-align: center; color: #999; padding: 30px 0; font-size: 14px; width: 100%; }

        .chart-section {
            border-top: 2px solid #eee;
            margin-top: 20px;
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .chart-wrapper { width: 100%; height: 400px; position: relative; }

        @media (max-width: 1250px) {
            .canvas { width: 100%; padding: 20px; }
            .content-area { flex-wrap: wrap; }
            .side-section { flex: 1 1 45%; min-width: 300px; border-right: none !important; margin-bottom: 20px; }
        }

        @media (max-width: 768px) {
            body { padding: 8px; }
            .canvas { width: 100% !important; padding: 16px 12px 8px; border-radius: 6px; }

            .header-section { margin-bottom: 12px; }
            .header-section h1 { font-size: 22px; letter-spacing: 2px; }

            #btnBar { position: static; align-items: center; margin-bottom: 12px; gap: 8px; }
            #btnBar .btn-row { flex-wrap: wrap; justify-content: center; }
            .download-btn { padding: 6px 16px; font-size: 13px; }

            .period-switcher { padding: 4px 14px; gap: 6px; margin-bottom: 14px; }
            .period-switcher .arrow { font-size: 18px; }
            .period-switcher .date { font-size: 13px; min-width: 140px; }

            .floor-switcher .arrow { font-size: 18px; }
            .floor-switcher .floor-text { font-size: 16px; min-width: 50px; }

            .buff-bar { padding: 10px 14px; }
            .buff-title { font-size: 14px; }
            .buff-desc { font-size: 12px; }

            .content-area { flex-direction: column; }
            .side-section { width: 100%; }

            .monster-card { width: 80px; }
            .monster-icon { width: 70px; height: 70px; }
            .monster-stats { font-size: 12px; line-height: 1.6; }

            .chart-wrapper { height: 280px; }

            .period-modal { width: 95vw; max-height: 90vh; border-radius: 12px; }
            .period-modal-header { padding: 14px 18px 12px; }
            .period-modal-title { font-size: 18px; }
            .period-grid { grid-template-columns: 1fr; padding: 14px 18px 18px; gap: 10px; }
            .period-card { padding: 12px 14px; }
            .period-card .pc-name { font-size: 15px; }
            .period-card .pc-time { font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="canvas">
    <div id="btnBar">
        <div class="btn-row">
            <button class="download-btn" id="downloadBtn">下载图片</button>
            <button class="download-btn" id="toggleFormatBtn">切换图片格式-png</button>
        </div>
    </div>

    <div class="header-section"><h1>混沌回忆</h1></div>

    <div class="period-switcher">
        <span class="arrow" id="prevSchedule">◀</span>
        <span class="date period-trigger" id="periodTrigger">
            <span id="scheduleDate">加载中...</span>
        </span>
        <span class="arrow" id="nextSchedule">▶</span>
    </div>

    <div class="floor-switcher">
        <span class="arrow" id="prevFloor">◀</span>
        <span class="floor-text" id="floorText">12</span>
        <span class="arrow" id="nextFloor">▶</span>
    </div>

    <!-- 记忆紊流框 -->
    <div class="buff-bar" id="buffBar">
        <div class="buff-title" id="buffName">记忆紊流</div>
        <div class="buff-desc" id="buffDesc">加载中...</div>
    </div>

    <!-- 多个房间横向排布 -->
    <div class="content-area" id="contentArea">
        <div class="side-section" id="upperSection">
            <div class="side-title">房间一 <span class="level-text" id="upperLevel"></span></div>
            <div id="upperLineup"></div>
        </div>
        <div class="side-section" id="lowerSection">
            <div class="side-title">房间二 <span class="level-text" id="lowerLevel"></span></div>
            <div id="lowerLineup"></div>
        </div>
        <div class="side-section" id="starSection" style="display:none;">
            <div class="side-title">星启模式 <span class="level-text" id="starLevel"></span></div>
            <div id="starLineup"></div>
        </div>
    </div>

    <div class="chart-section">
        <div class="chart-wrapper" id="totalChart"></div>
        <div class="chart-wrapper" id="bossChart"></div>
    </div>
</div>

<div class="period-overlay" id="periodOverlay">
    <div class="period-modal">
        <div class="period-modal-header">
            <div>
                <div class="period-modal-title" id="modalCurrentName">7.1</div>
                <div class="period-modal-time" id="modalCurrentTime">2026/09/30 - 2026/11/03</div>
            </div>
            <button class="period-modal-close" id="periodModalClose">✕</button>
        </div>
        <div class="period-grid" id="periodGrid"></div>
    </div>
</div>

<script>
    // ============================================================
    // 1. 配置
    // ============================================================
    const DATA_ROOT = 'data/chaos';
    // 修复：图片路径改为正确的 images/element 和 images/monster
    const ELEMENT_IMAGE_ROOT = 'images/element';

    let allEntries = [];
    let monsterCatalog = {};
    let currentIndex = 0;
    let currentFloorIndex = 11;
    let chartInstance1 = null;
    let chartInstance2 = null;
    let currentImageFormat = 'webp';

    const byId = (id) => document.getElementById(id);
    const wrapIndex = (i, len) => (i + len) % len;

    // ============================================================
    // 2. 数据加载
    // ============================================================
    async function loadMonsterCatalog() {
        const res = await fetch(`${DATA_ROOT}/monster_catalog.json`);
        if (!res.ok) throw new Error('无法加载 monster_catalog.json');
        monsterCatalog = await res.json();
    }

    async function loadIndex() {
        const res = await fetch(`${DATA_ROOT}/index.json`);
        if (!res.ok) throw new Error('无法加载 index.json');
        const data = await res.json();
        return data.entries || [];
    }

    async function loadEntryData(fileName) {
        const res = await fetch(`${DATA_ROOT}/${fileName}`);
        if (!res.ok) throw new Error(`无法加载 ${fileName}`);
        return res.json();
    }

    function getMonsterInfo(id) {
        const raw = monsterCatalog[String(id)] || {};
        return {
            id: id,
            name: raw["4"] || `怪物 ${id}`,
            imagePath: raw["1"] || '',
            stance: raw["3"] || 0,
        };
    }

    function htmlBuffText(value) {
        if (!value) return '';
        let html = String(value).replaceAll("@", "<color style='color:#f29e38;'>").replaceAll("#", "</color>");
        html = html.replace(/(\d+(?:\.\d+)?%?)/g, '<color style="color:#f29e38;">$1</color>');
        return html;
    }

    // ============================================================
    // 3. 血量计算
    // ============================================================
    function monsterTotalHp(monster) {
        return monster.hp * (monster.hp_ratio_sum ?? 1);
    }

    function battleStages(floor) {
        return (floor.upper || []).concat(floor.lower || [], floor.star || []);
    }

    function floorHpSingle(floor) {
        let total = 0;
        battleStages(floor).forEach(stage => {
            (stage.monsters || []).forEach(wave => {
                (wave || []).forEach(monster => {
                    total += monsterTotalHp(monster);
                });
            });
        });
        return Math.round(total);
    }

    function floorHpMultiple(floor) {
        let total = 0;
        battleStages(floor).forEach(stage => {
            (stage.monsters || []).forEach(wave => {
                const waveHp = (wave || []).map(m => monsterTotalHp(m));
                total += Math.max(...waveHp, 0);
            });
        });
        return Math.round(total);
    }

    function sideHp(floor, side) {
        const stages = floor[side] || [];
        let total = 0;
        stages.forEach(stage => {
            (stage.monsters || []).forEach(wave => {
                (wave || []).forEach(monster => {
                    total += monsterTotalHp(monster);
                });
            });
        });
        return Math.round(total);
    }

    // ============================================================
    // 4. 渲染
    // ============================================================
    const updateHeader = () => {
        const entry = allEntries[currentIndex];
        if (!entry) return;
        byId("scheduleDate").innerHTML = `${entry.chaos_name || ''}<br>${entry.time || ""}`;
    };

    const renderFloorText = () => {
        byId("floorText").textContent = String(currentFloorIndex + 1);
    };

    const renderElemMini = (elemCN) => {
        const basePath = `${ELEMENT_IMAGE_ROOT}/${elemCN}`;
        const fallback = `this.onerror=null; this.src='${basePath}.webp'; this.onerror=function(){ this.style.display='none'; };`;
        return `<span class="elem-mini"><img src="${basePath}.avif" alt="${elemCN}" onerror="${fallback}"></span>`;
    };

    const renderMonsterCard = (monster, level) => {
        const info = getMonsterInfo(monster.id);
        const name = info.name;
        let imgPath = info.imagePath || '';
        if (currentImageFormat === 'png') imgPath = imgPath.replace('.webp', '.png');
        const fallbackChar = (name || '?').charAt(0);

        const iconHtml = `<img src="${imgPath}" alt="${name}" loading="lazy"
            onerror="this.onerror=null; this.style.display='none'; this.parentElement.innerHTML='<span class=\\'fallback\\'>${fallbackChar}</span>';">`;

        // 修复：弱点数据取自 monster.weakness
        const weaknessHtml = (monster.weakness || []).map(w => renderElemMini(w)).join('');

        // 韧性数值 ×10
        const stance = (monster.stance || info.stance || 0) * 10;
        const speed = monster.speed || '?';
        const times = monster.hp_ratio_sum ? monster.hp_ratio_sum : '';
        const hpText = times ? `${monster.hp}×${times}` : `${monster.hp}`;

        return `<div class="monster-card">
            <div class="monster-icon">${iconHtml}</div>
            <div class="monster-weakness">${weaknessHtml}</div>
            <div class="monster-stats">
                <div class="stance">${stance}</div>
                <div class="hp">${hpText}</div>
                <div class="speed">${speed}</div>
            </div>
        </div>`;
    };

    const renderStage = (stage, level) => {
        // 找到该房间血量最高的怪，作为判断 Boss 的标准
        let maxHpInStage = 0;
        (stage.monsters || []).forEach(wave => {
            (wave || []).forEach(m => {
                const hp = monsterTotalHp(m);
                if (hp > maxHpInStage) maxHpInStage = hp;
            });
        });

        const wavesHtml = (stage.monsters || []).map((wave, wi) => {
            const monstersHtml = (wave || []).map(m => renderMonsterCard(m, level)).join('');
            
            // 中文数字波次
            const chineseNums = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
            let waveTitle = `第${chineseNums[wi] || (wi + 1)}波`;

            // 如果该波只有1个怪，且血量等于该房间最高血量（视为首领波），替换为加粗名称
            if (wave.length === 1) {
                const monsterHp = monsterTotalHp(wave[0]);
                if (monsterHp === maxHpInStage) {
                    waveTitle = `<b>${getMonsterInfo(wave[0].id).name}</b>`;
                }
            }

            return `<div class="wave-block">
                <div class="wave-label">${waveTitle}</div>
                <div class="wave-monsters">${monstersHtml}</div>
            </div>`;
        }).join('');
        
        return `<div class="stage-block">
            ${wavesHtml}
        </div>`;
    };

    // 渲染房间
    const renderSide = (sectionId, lineupId, levelId, stages, level) => {
        const section = byId(sectionId);
        const lineup = byId(lineupId);
        const levelEl = byId(levelId);
        
        if (!stages || !stages.length) {
            section.style.display = 'none';
            return;
        }
        
        section.style.display = 'flex';
        levelEl.textContent = `Lv${level || '?'}`;
        lineup.innerHTML = stages.map(stage => renderStage(stage, level)).join('');
    };

    const renderBuff = () => {
        const entry = allEntries[currentIndex];
        if (!entry || !entry.buff) {
            byId('buffBar').style.display = 'none';
            return;
        }
        byId('buffBar').style.display = '';
        byId('buffName').textContent = entry.buff.name || '';
        byId('buffDesc').innerHTML = htmlBuffText(entry.buff.description || '');
    };

    const renderMonsterArea = () => {
        const entry = allEntries[currentIndex];
        if (!entry || !entry.floors) return;

        const floor = entry.floors[currentFloorIndex];
        if (!floor) return;

        renderSide('upperSection', 'upperLineup', 'upperLevel', floor.upper, floor.level);
        renderSide('lowerSection', 'lowerLineup', 'lowerLevel', floor.lower, floor.level);

        const starSection = byId('starSection');
        if (floor.star && floor.star.length) {
            starSection.style.display = 'flex';
            byId('starLevel').textContent = `Lv${floor.level || '?'}`;
            byId('starLineup').innerHTML = floor.star.map(stage => renderStage(stage, floor.level)).join('');
        } else {
            starSection.style.display = 'none';
        }
    };

    // 图表范围截断
    function getChartEntries() {
        if (currentFloorIndex < 10) return allEntries.slice().reverse();
        
        const startName = "藏于深空之秘";
        const idx = allEntries.findIndex(e => e.chaos_name === startName);
        if (idx === -1) return allEntries.slice().reverse();
        
        return allEntries.slice(0, idx + 1).reverse();
    }

    const renderCharts = () => {
        if (!allEntries.length) return;

        const chartEntries = getChartEntries();
        const labels = chartEntries.map(e => e.chaos_name || "未知");

        const singleData = [];
        const multiData = [];
        const upperData = [];
        const lowerData = [];
        const starData = [];

        chartEntries.forEach(entry => {
            const floor = (entry.floors || [])[currentFloorIndex];
            if (!floor) {
                singleData.push(null);
                multiData.push(null);
                upperData.push(null);
                lowerData.push(null);
                starData.push(null);
                return;
            }
            
            const hasStarInFloor = (floor.star && floor.star.length > 0);
            
            singleData.push(floorHpSingle(floor));
            multiData.push(floorHpMultiple(floor));
            upperData.push(sideHp(floor, 'upper'));
            lowerData.push(sideHp(floor, 'lower'));
            starData.push(hasStarInFloor ? sideHp(floor, 'star') : null);
        });

        if (!chartInstance1) chartInstance1 = echarts.init(byId("totalChart"));
        chartInstance1.setOption({
            title: { text: `混沌回忆血量演化`, left: "center", top: "2%", textStyle: { fontSize: 16, fontWeight: 'bold', color: "#000" } },
            tooltip: { trigger: "axis" },
            legend: { top: "8%", left: "center", textStyle: { fontSize: 12 } },
            grid: { left: "5%", right: "5%", top: "18%", bottom: "5%", containLabel: true },
            xAxis: { type: "category", data: labels, axisLabel: { fontSize: 10, rotate: 45 } },
            yAxis: { type: "value", axisLabel: { fontSize: 10 } },
            series: [
                { name: "单攻", type: "line", data: singleData, smooth: false, symbol: 'emptyCircle', symbolSize: 4, lineStyle: { color: "#cc0000" }, itemStyle: { color: "#cc0000" }, connectNulls: false },
                { name: "群攻", type: "line", data: multiData, smooth: false, symbol: 'emptyCircle', symbolSize: 4, lineStyle: { color: "#2545ba" }, itemStyle: { color: "#2545ba" }, connectNulls: false }
            ]
        });

        if (!chartInstance2) chartInstance2 = echarts.init(byId("bossChart"));
        // 修复：各间颜色参考最早发的幽境危战index：#a855f7, #10b981, #f59e0b
        const series = [
            { name: "房间一", type: "line", data: upperData, smooth: false, symbol: 'emptyCircle', symbolSize: 4, lineStyle: { color: "#a855f7" }, itemStyle: { color: "#a855f7" }, connectNulls: false },
            { name: "房间二", type: "line", data: lowerData, smooth: false, symbol: 'emptyCircle', symbolSize: 4, lineStyle: { color: "#10b981" }, itemStyle: { color: "#10b981" }, connectNulls: false }
        ];
        
        const currentFloorData = (allEntries[currentIndex].floors || [])[currentFloorIndex];
        const hasStarData = (currentFloorData && currentFloorData.star && currentFloorData.star.length > 0);
        
        if (hasStarData) {
            series.push({ name: "星启模式", type: "line", data: starData, smooth: false, symbol: 'emptyCircle', symbolSize: 4, lineStyle: { color: "#f59e0b" }, itemStyle: { color: "#f59e0b" }, connectNulls: false });
        }

        chartInstance2.setOption({
            title: { text: `第${currentFloorIndex + 1}层 各房间血量演化`, left: "center", top: "2%", textStyle: { fontSize: 14, color: "#333" } },
            tooltip: { trigger: "axis" },
            legend: { top: "8%", left: "center", textStyle: { fontSize: 10 } },
            grid: { left: "5%", right: "5%", top: "18%", bottom: "5%", containLabel: true },
            xAxis: { type: "category", data: labels, axisLabel: { fontSize: 10, rotate: 45 } },
            yAxis: { type: "value", axisLabel: { fontSize: 10 } },
            series
        }, { replaceMerge: ['series'] }); 
    };

    const render = () => {
        updateHeader();
        renderFloorText();
        renderBuff();
        renderMonsterArea();
        renderCharts();
    };

    // ============================================================
    // 5. 期数选择弹层
    // ============================================================
    const renderPeriodGrid = () => {
        const grid = byId("periodGrid");
        if (!grid) return;
        grid.innerHTML = allEntries.map((entry, i) => {
            const active = i === currentIndex ? "active" : "";
            return `<div class="period-card ${active}" data-index="${i}">
                        <div class="pc-name">${entry.chaos_name || ""}</div>
                        <div class="pc-time">${entry.time || ""}</div>
                    </div>`;
        }).join('');

        grid.querySelectorAll(".period-card").forEach(card => {
            card.addEventListener("click", () => {
                const idx = Number(card.dataset.index);
                if (idx === currentIndex) { closePeriodModal(); return; }
                currentIndex = idx;
                const maxFloor = (allEntries[currentIndex].floors || []).length - 1;
                if (currentFloorIndex > maxFloor) currentFloorIndex = maxFloor;
                if (currentFloorIndex < 0) currentFloorIndex = 0;
                closePeriodModal();
                render();
            });
        });
    };

    const openPeriodModal = () => {
        const entry = allEntries[currentIndex];
        if (!entry) return;
        byId("modalCurrentName").textContent = entry.chaos_name || "";
        byId("modalCurrentTime").textContent = entry.time || "";
        renderPeriodGrid();
        byId("periodOverlay").classList.add("show");
    };

    const closePeriodModal = () => {
        byId("periodOverlay").classList.remove("show");
    };

    // ============================================================
    // 6. 事件
    // ============================================================
    const bindEvents = () => {
        byId("downloadBtn").addEventListener("click", async (e) => {
            e.preventDefault();
            const btnBar = byId("btnBar");
            const canvasEl = document.querySelector(".canvas");
            const origStyle = canvasEl.getAttribute("style") || "";

            btnBar.classList.add("hidden");
            canvasEl.style.boxShadow = "none";

            await new Promise(r => requestAnimationFrame(r));

            try {
                const canvas = await html2canvas(canvasEl, {
                    scale: 2,
                    backgroundColor: "#ffffff",
                    useCORS: true,
                    allowTaint: true,
                    windowWidth: canvasEl.scrollWidth,
                    windowHeight: canvasEl.scrollHeight,
                    width: canvasEl.scrollWidth,
                    height: canvasEl.scrollHeight,
                });

                const a = document.createElement("a");
                const entry = allEntries[currentIndex];
                a.download = `混沌回忆_${entry?.chaos_name || "未命名"}.png`;
                a.href = canvas.toDataURL("image/png");
                a.click();
            } catch (err) {
                console.error("截图失败:", err);
                alert("截图失败，请查看控制台。");
            } finally {
                btnBar.classList.remove("hidden");
                canvasEl.setAttribute("style", origStyle);
            }
        });

        byId("toggleFormatBtn").addEventListener("click", () => {
            currentImageFormat = currentImageFormat === 'webp' ? 'png' : 'webp';
            byId("toggleFormatBtn").textContent = currentImageFormat === 'webp'
                ? '切换图片格式-png'
                : '切换图片格式-webp';
            renderMonsterArea();
        });

        byId("prevSchedule").addEventListener("click", (e) => {
            e.stopPropagation();
            currentIndex = wrapIndex(currentIndex + 1, allEntries.length);
            const maxFloor = (allEntries[currentIndex].floors || []).length - 1;
            if (currentFloorIndex > maxFloor) currentFloorIndex = maxFloor;
            if (currentFloorIndex < 0) currentFloorIndex = 0;
            render();
        });
        byId("nextSchedule").addEventListener("click", (e) => {
            e.stopPropagation();
            currentIndex = wrapIndex(currentIndex - 1, allEntries.length);
            const maxFloor = (allEntries[currentIndex].floors || []).length - 1;
            if (currentFloorIndex > maxFloor) currentFloorIndex = maxFloor;
            if (currentFloorIndex < 0) currentFloorIndex = 0;
            render();
        });

        byId("prevFloor").addEventListener("click", () => {
            const maxFloor = (allEntries[currentIndex].floors || []).length - 1;
            currentFloorIndex = wrapIndex(currentFloorIndex - 1, maxFloor + 1);
            render();
        });
        byId("nextFloor").addEventListener("click", () => {
            const maxFloor = (allEntries[currentIndex].floors || []).length - 1;
            currentFloorIndex = wrapIndex(currentFloorIndex + 1, maxFloor + 1);
            render();
        });

        byId("periodTrigger").addEventListener("click", (e) => {
            e.stopPropagation();
            openPeriodModal();
        });
        byId("periodModalClose").addEventListener("click", closePeriodModal);
        byId("periodOverlay").addEventListener("click", (e) => {
            if (e.target.id === "periodOverlay") closePeriodModal();
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closePeriodModal();
        });

        window.addEventListener('resize', () => {
            if (chartInstance1) chartInstance1.resize();
            if (chartInstance2) chartInstance2.resize();
        });
    };

    // ============================================================
    // 7. 初始化
    // ============================================================
    async function init() {
        try {
            await loadMonsterCatalog();
            const entryFiles = await loadIndex();
            if (!entryFiles.length) throw new Error('index.json 为空');

            allEntries = await Promise.all(entryFiles.map(file => loadEntryData(file)));

            currentIndex = 0;
            currentFloorIndex = (allEntries[0].floors || []).length - 1;
            if (currentFloorIndex < 0) currentFloorIndex = 0;

            bindEvents();
            render();
        } catch (err) {
            console.error('初始化失败:', err);
            byId("contentArea").innerHTML = `<div class="empty-hint" style="color:red;">数据加载失败: ${err.message}</div>`;
        }
    }

    document.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
